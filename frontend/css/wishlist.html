<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

   <link rel="stylesheet" href="wishlist.css">
   <script src="wishlist.js" ></script>
</head>

<body>
<header class="header">
    <div class="header-left">
      <img src="images/Frame 37.png" class="logo-image" alt="logo">
      <div class="divider"></div>
    </div>

    <div class="header-center">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" placeholder="Пошук подій ...">
      </div>

      <button class="add-event-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>

      <div class="header-filters">
        <div class="filter-pill date-filter">
          <label for="header-date" style="display: flex; align-items: center; gap: 8px; cursor: pointer; width: 100%;">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span id="header-date-text">Дата</span>
            <input type="date" id="header-date" style="position: absolute; opacity: 0; width: 0; height: 0;">
          </label>
        </div>

        <div class="filter-pill city-filter">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          Місто
          <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>

        <button class="filter-pill">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="3" y1="15" x2="21" y2="15"></line>
          </svg>
          Категорії
        </button>
      </div>
    </div>

    <div class="header-right">
      <div class="language-btn">UA</div>
      <div class="icon-btn">
        <img src="images/Frame 39.png" alt="icon">
        <span class="red-dot"></span>
      </div>
      <div class="icon-btn" id="profileBtn">
        <img src="images/Frame 38.png" alt="icon">
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <!-- Selected Events Section -->
    <section class="section">
      <div class="container">
        <h1 class="main-title">Обрані події</h1>

        <div class="events-grid" id="selectedEvents"></div>

        <div class="divider"></div>

        <!-- Popular Events Section -->
        <div class="popular-header">
          <h2 class="section-title">Популярні події</h2>
          <p class="section-subtitle">Перегляньте, що зараз популярно</p>
        </div>

        <div class="events-grid-popular" id="popularEvents"></div>
      </div>
    </section>
  </main>

<footer class="site-footer">
  <div class="footer-top">
    
    <div class="footer-column">
      <h4>Event Manager</h4>
      <a href="#">Підтримка</a>
      <a href="#">Контакти</a>
      <a href="#">Приватність & cookies</a>
      <a href="#">Політика використання</a>
    </div>
    
    <div class="footer-column">
      <h4>Розробники</h4>
      <a href="#">Про команду</a>
      <a href="#">Про сайт</a>
    </div>
    
    <div class="footer-column">
      <h4>Слідкуйте за<br>нами</h4>
      <a href="#" class="social-link">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="ig-grad" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
              <stop stop-color="#fdf497" offset="0%"/>
              <stop stop-color="#fd5949" offset="50%"/>
              <stop stop-color="#d6249f" offset="100%"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke="url(#ig-grad)" stroke-width="2.5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" stroke="url(#ig-grad)" stroke-width="2.5"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5" stroke="url(#ig-grad)" stroke-width="2.5" stroke-linecap="round"></line>
        </svg>
      </a>
    </div>

  </div>
  
  <div class="footer-bottom">
    <p>Українська (Україна)</p>
    <p>© CodeX 2026</p>
  </div>
</footer>

<script src="events.js"></script>
</body>
</html>
